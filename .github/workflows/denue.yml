name: Captura Automática DENUE y Marco Geoestadístico

on:
  schedule:
    # Ejecución mensual programada: Día 1 de cada mes a las 14:00 UTC
    - cron: '0 14 1 * *'
  workflow_dispatch:

concurrency:
  group: captura-denue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  captura-denue:
    name: Ingesta Bronce Geoespacial (DENUE + Marco) y Validación
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Extractor Ético DENUE y Marco Geoestadístico
        # Nota: La descarga del paquete estatal masivo (denue_06_csv.zip) y del Marco Geoestadístico
        # no requieren autenticación (son abiertos en inegi.org.mx). INEGI_DENUE_TOKEN / INEGI_API_TOKEN
        # son opcionales y se emplean únicamente para una sonda preliminar a la API REST interactiva.
        env:
          INEGI_DENUE_TOKEN: ${{ secrets.INEGI_DENUE_TOKEN }}
          INEGI_API_TOKEN: ${{ secrets.INEGI_API_TOKEN }}
        run: |
          python src/denue/extractor_denue.py

      - name: Validar Integridad de Capa Bronce Geoespacial y Puerta de Calidad
        run: |
          python -c "
          import hashlib, json, zipfile
          from pathlib import Path
          d_dir = Path('datos/bronce/denue')
          m_dir = Path('datos/bronce/marco_geoestadistico')
          zips = sorted(d_dir.glob('denue_colima_raw_*.zip'))
          geos = sorted(m_dir.glob('marco_geoestadistico_colima_municipios_*.geojson'))
          assert zips and geos, 'Faltan archivos crudos geoespaciales en Bronce'
          z, g = zips[-1], geos[-1]
          with zipfile.ZipFile(z) as zf:
              assert zf.testzip() is None, 'Archivo ZIP DENUE corrupto'
          meta_z = json.loads((d_dir / z.name.replace('raw_', 'metadata_').replace('.zip', '.json')).read_text(encoding='utf-8'))
          assert hashlib.sha256(z.read_bytes()).hexdigest() == meta_z['sha256'], 'SHA-256 DENUE no coincide'
          meta_g = json.loads((m_dir / g.name.replace('municipios_', 'metadata_').replace('.geojson', '.json')).read_text(encoding='utf-8'))
          assert hashlib.sha256(g.read_bytes()).hexdigest() == meta_g['sha256'], 'SHA-256 Marco Geoestadístico no coincide'
          gj = json.loads(g.read_text(encoding='utf-8'))
          assert len(gj.get('features', [])) == 10, 'Se esperaban exactamente 10 municipios de Colima'
          print('Validación Bronce Geoespacial APROBADA.')
          "
          python src/denue/plata_geo.py
          pytest -v tests/test_geo_pipeline.py

      - name: Commit y Push de Archivos Nuevos en Bronce Geoespacial
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # Agregar únicamente archivos crudos y metadatos geoespaciales en Bronce
          git add datos/bronce/denue/ datos/bronce/marco_geoestadistico/

          # Comprobar si hay cambios staged para commitear
          if ! git diff --staged --quiet; then
            FECHA_HOY=$(date -u +'%Y-%m-%d')
            git commit -m "captura automática bronce denue/marco ${FECHA_HOY}"
            git push origin main
          else
            echo "No hay archivos nuevos en Bronce Geoespacial. No se requiere commit."
          fi
